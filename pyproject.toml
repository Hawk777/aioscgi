[build-system]
requires = ["hatchling >= 1.14.1"]
build-backend = "hatchling.build"

[dependency-groups]
ci = [
	"mypy-gitlab-code-quality",
	"pylint-gitlab",
]
dev = [
	"mypy ~= 2.3.1",
	"pylint ~= 4.0.8",
	"pytest ~= 9.1.1",
	"pytest-asyncio ~= 1.4.0",
	"ruff ~= 0.16.6",
]

[project]
name = "aioscgi"
version = "2.3.1"
dependencies = [
	"sioscgi >= 5.0, < 6.0",
]
requires-python = ">= 3.12"
license = "GPL-3.0-only"
scripts.aioscgi = "aioscgi.main:main"
authors = [
	{ name = "Christopher Head" },
]
description = "An ASGI server that speaks SCGI."
readme = "README.md"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
urls.Repository = "https://gitlab.com/Hawk777/aioscgi"
entry-points."aioscgi.io".asyncio = "aioscgi.asyncio"

[tool.hatch.build.targets.sdist]
exclude = [
	"/.gitlab-ci.yml",
	"/.python-version",
	"/.uv-cache",
	"/uv.lock",
]

[tool.pylint.messages_control]
enable = [
	"deprecated-pragma",
	"useless-suppression",
	"use-symbolic-message-instead",
]
disable = [
	"line-too-long",
	"no-else-raise",
	"no-else-return",
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-branches",
	"too-many-instance-attributes",
	"too-many-locals",
	"too-many-nested-blocks",
	"too-many-positional-arguments",
	"too-many-return-statements",
	"too-many-statements",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
strict = true
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
allowed-confusables = ["’"]
ignore = [
	"ANN401", # any-type
	"C901", # complex-structure
	"COM812", # missing-trailing-comma
	"CPY001", # missing-copyright-notice
	"D203", # one-blank-line-before-class
	"D212", # multi-line-summary-first-line
	"FBT001", # boolean-type-hint-positional-argument
	"PLR09", # too-many-<foo>
	"PLR2004", # magic-value-comparison
	"S101", # assert
	"TC001", # typing-only-first-party-import
	"TC003", # typing-only-standard-library-import
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["INP001"] # implicit-namespace-package (not really a package, with import-mode=importlib)
