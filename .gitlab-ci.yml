variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  YARN_GLOBAL_FOLDER: .yarn-cache

default:
  interruptible: true

.node:
  cache:
    key:
      prefix: corepack-and-yarn
      files:
        - package.json
        - yarn.lock
    paths:
      - .corepack-cache
      - $YARN_GLOBAL_FOLDER
  image:
    name: node:26-slim
  before_script:
    # We need the Corepack cache to be in ./.corepack-cache so it can be cached
    # as a GitLab CI cache—that is only willing to cache things inside the
    # working directory. However, Corepack is going to put Yarn inside that
    # directory and run it from there. If it does so, then our own package’s
    # package.json will be the nearest ancestor of the Yarn executable, and so
    # will be consulted for the settings to apply *to the Yarn executable*,
    # which is completely inappropriate (in particular type: module completely
    # breaks Yarn). Therefore, rather than using the corepack cache in place,
    # we move it from inside the working directory to its default location
    # (~/.cache/node/corepack) here, before using it, and then move it back
    # afterwards so it can be cached.
    - "[[ -d .corepack-cache ]] && mkdir -p ${HOME}/.cache/node && mv .corepack-cache ${HOME}/.cache/node/corepack"
    # Corepack isn’t shipped as part of Node, so it has to be installed via
    # NPM.
    - npm --global install corepack
    # Install Yarn.
    - corepack install
    # Install the actual dependencies.
    - yarn install --immutable
  after_script:
    # Move the Corepack cache back to ./.corepack-cache so it can be picked up
    # by GitLab CI.
    - "mv ${HOME}/.cache/node/corepack .corepack-cache"

.uv:
  image: ghcr.io/astral-sh/uv:0.13-python3.14-trixie
  cache:
    key:
      prefix: uv
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  after_script:
    - uv cache prune

Package:
  extends: .uv
  stage: build
  needs: []
  script:
    - uv build
  artifacts:
    paths:
      - dist/*
    exclude:
      - dist/.gitignore

Pylint:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pylint --output=pylint-gitlab.json --load-plugins=pylint_gitlab --output-format=gitlab-codeclimate src tests
  artifacts:
    reports:
      codequality:
        - pylint-gitlab.json

Pyright:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pyright --outputjson src tests > pyright.json
  artifacts:
    paths:
      - pyright.json
    when: always

Pyright to GitLab:
  extends: .node
  needs: [Pyright]
  when: always
  script:
    - yarn exec pyright-to-gitlab-ci --src=pyright.json --output=pyright-gitlab.json --base_path=.
  artifacts:
    reports:
      codequality:
        - pyright-gitlab.json

Pytest:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pytest --junit-xml=results.xml
  artifacts:
    reports:
      junit: results.xml

Ruff:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci ruff format --check --diff
    - uv run --locked --group ci ruff check --output-format=gitlab > ruff-gitlab.json
  artifacts:
    reports:
      codequality:
        - ruff-gitlab.json

Publish to PyPI:
  extends: .uv
  environment: pypi
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - uv publish
