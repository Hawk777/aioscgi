[build-system]
requires = ["uv_build ~= 0.13.4"]
build-backend = "uv_build"

[dependency-groups]
ci = [
	"pylint-gitlab",
]
dev = [
	"asgi-types ~= 0.2.0",
	"pylint ~= 4.1.3",
	"pyright ~= 1.1.414",
	"pytest ~= 9.2.0",
	"pytest-asyncio ~= 1.4.1",
	"ruff ~= 0.17.3",
]

[project]
name = "aioscgi"
version = "2.5.1"
dependencies = [
	"sioscgi ~= 5.0",
]
requires-python = ">= 3.14"
license = "GPL-3.0-only"
scripts.aioscgi = "aioscgi.main:main"
authors = [
	{ name = "Christopher Head" },
]
description = "An ASGI server that speaks SCGI."
readme = "README.md"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
urls.Repository = "https://gitlab.com/Hawk777/aioscgi"
entry-points."aioscgi.io".asyncio = "aioscgi.asyncio"

[tool.pylint.messages_control]
enable = [
	"deprecated-pragma",
	"useless-suppression",
	"use-symbolic-message-instead",
]
disable = [
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-instance-attributes",
	"too-many-locals",
	"too-many-positional-arguments",
	"too-many-return-statements",
]

[tool.pyright]
exclude = [".ruff_cache"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest]
addopts = ["--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
strict = true
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
allowed-confusables = ["’"]
ignore = [
	"COM812", # missing-trailing-comma
	"CPY001", # missing-copyright-notice
	"D203", # one-blank-line-before-class
	"D212", # multi-line-summary-first-line
	"FBT001", # boolean-type-hint-positional-argument
	"PLR09", # too-many-<foo>
	"S101", # assert
]
select = ["ALL"]

[tool.uv.build-backend]
source-include = ["CHANGELOG.rst", "tests/**"]
