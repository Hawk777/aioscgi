variables:
  NPM_CACHE_DIR: .npm-cache
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

default:
  interruptible: true

.node:
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - $NPM_CACHE_DIR
  image:
    name: node:slim

.uv:
  image: ghcr.io/astral-sh/uv:0.13-python3.14-trixie
  cache:
    key:
      prefix: uv
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  after_script:
    - uv cache prune

Package:
  extends: .uv
  stage: build
  needs: []
  script:
    - uv build
  artifacts:
    paths:
      - dist/*
    exclude:
      - dist/.gitignore

Pylint:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pylint --output=pylint-gitlab.json --load-plugins=pylint_gitlab --output-format=gitlab-codeclimate src tests
  artifacts:
    reports:
      codequality:
        - pylint-gitlab.json

Pyright:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pyright --outputjson src tests > pyright.json
  artifacts:
    paths:
      - pyright.json
    when: always

Pyright to GitLab:
  extends: .node
  needs: [Pyright]
  when: always
  script:
    - npm --cache=$NPM_CACHE_DIR ci
    - npm --cache=$NPM_CACHE_DIR exec -- pyright-to-gitlab-ci --src=pyright.json --output=pyright-gitlab.json --base_path=.
  artifacts:
    reports:
      codequality:
        - pyright-gitlab.json

Pytest:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci pytest --junit-xml=results.xml
  artifacts:
    reports:
      junit: results.xml

Ruff:
  extends: .uv
  needs: []
  script:
    - uv run --locked --group ci ruff format --check --diff
    - uv run --locked --group ci ruff check --output-format=gitlab > ruff-gitlab.json
  artifacts:
    reports:
      codequality:
        - ruff-gitlab.json

Publish to PyPI:
  extends: .uv
  environment: pypi
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - uv publish
